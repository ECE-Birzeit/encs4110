<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 330' width='900' height='330' role='img' aria-label='I2C bus: the LaunchPad and every device share two wires, SCL and SDA, pulled up to the supply by resistors; each device has its own address'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#333'/></marker></defs><rect width='900' height='330' fill='#fff'/><rect x='30' y='170' width='150' height='110' rx='8' fill='#f6f8fa' stroke='#57606a' stroke-width='1.5'/><text x='105.0' y='192' text-anchor='middle' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='14' fill='#24292f' font-weight='600'>TM4C123</text><text x='105.0' y='212' text-anchor='middle' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='12' fill='#57606a'>I2C0 master</text><text x='105.0' y='230' text-anchor='middle' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='12' fill='#57606a'>PB2 = SCL</text><text x='105.0' y='248' text-anchor='middle' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='12' fill='#57606a'>PB3 = SDA</text><line x1='180' y1='200' x2='860' y2='200' stroke='#2563eb' stroke-width='2.5'/><text x='868' y='204' text-anchor='start' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='13' fill='#24292f'>SCL</text><line x1='180' y1='240' x2='860' y2='240' stroke='#00878F' stroke-width='2.5'/><text x='868' y='244' text-anchor='start' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='13' fill='#24292f'>SDA</text><line x1='220' y1='70' x2='290' y2='70' stroke='#333' stroke-width='1.5'/><text x='255' y='62' text-anchor='middle' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='12' fill='#24292f'>5 V</text><polyline fill='none' stroke='#333' stroke-width='1.5' points='230,70 230,80 236,84 224,89 236,94 224,99 236,104 224,109 230,114 230,200'/><circle cx='230' cy='200' r='3.5' fill='#333'/><polyline fill='none' stroke='#333' stroke-width='1.5' points='280,70 280,80 286,84 274,89 286,94 274,99 286,104 274,109 280,114 280,240'/><circle cx='280' cy='240' r='3.5' fill='#333'/><text x='214' y='110' text-anchor='end' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='11' fill='#57606a'>pull-ups</text><text x='214' y='124' text-anchor='end' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='11' fill='#57606a'>(on the backpack)</text><rect x='380' y='40' width='170' height='100' rx='8' fill='#f6f8fa' stroke='#57606a' stroke-width='1.5'/><text x='465.0' y='62' text-anchor='middle' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='14' fill='#24292f' font-weight='600'>PCF8574 backpack</text><text x='465.0' y='82' text-anchor='middle' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='12' fill='#57606a'>address 0x27</text><text x='465.0' y='100' text-anchor='middle' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='12' fill='#57606a'>(or 0x3F)</text><text x='465.0' y='118' text-anchor='middle' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='12' fill='#57606a'>drives the LCD</text><line x1='440' y1='140' x2='440' y2='200' stroke='#333' stroke-width='1.5'/><circle cx='440' cy='200' r='3.5' fill='#333'/><line x1='490' y1='140' x2='490' y2='240' stroke='#333' stroke-width='1.5'/><circle cx='490' cy='240' r='3.5' fill='#333'/><rect x='620' y='40' width='170' height='100' rx='8' fill='#f6f8fa' stroke='#57606a' stroke-width='1.5' stroke-dasharray='6 4'/><text x='705.0' y='62' text-anchor='middle' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='14' fill='#24292f' font-weight='600'>Another device</text><text x='705.0' y='82' text-anchor='middle' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='12' fill='#57606a'>own address,</text><text x='705.0' y='100' text-anchor='middle' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='12' fill='#57606a'>e.g. 0x68</text><text x='705.0' y='118' text-anchor='middle' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='12' fill='#57606a'>same two wires</text><line x1='680' y1='140' x2='680' y2='200' stroke='#333' stroke-width='1.5' stroke-dasharray='4 3'/><circle cx='680' cy='200' r='3.5' fill='#333'/><line x1='730' y1='140' x2='730' y2='240' stroke='#333' stroke-width='1.5' stroke-dasharray='4 3'/><circle cx='730' cy='240' r='3.5' fill='#333'/><line x1='465' y1='40' x2='465' y2='14' stroke='#333' marker-end='url(#a)' stroke-width='1.5'/><text x='475' y='20' text-anchor='start' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='12' fill='#24292f'>to the 16x2 LCD: RS, RW, E, backlight, D4 to D7</text><text x='520' y='300' text-anchor='middle' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='12' fill='#57606a'>Every device only pulls a line low or lets it go; the resistors pull it back up.</text></svg>