<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1120 470' width='1120' height='470' role='img' aria-label='State diagram of the reaction game. Idle: SW1 starts a random wait and goes to Waiting. Waiting, LED off: when Timer1A runs out the LED turns green and the game goes to Go; SW2 before that is a false start: red, back to Idle. Go, green: SW2 stores the reaction time, turns the LED blue for a success, and goes back to Idle. Presses not shown are ignored.'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#333'/></marker></defs><rect width='1120' height='470' fill='#fff'/><path d='M279.3,283.2 Q371.1,196.1 493.9,166.1' fill='none' stroke='#c2410c' stroke-width='3'/><polygon points='493.9,166.1 482.0,176.2 478.7,162.6' fill='#c2410c'/><rect x='245.6' y='188.4' width='206.4' height='24.0' rx='4' fill='#ffffff'/><text x='348.8' y='200.4' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='13' font-weight='700' fill='#c2410c'>SW1: start the random wait</text><path d='M510.7,196.8 Q418.9,283.9 296.1,313.9' fill='none' stroke='#7c3aed' stroke-width='3'/><polygon points='296.1,313.9 308.0,303.8 311.3,317.4' fill='#7c3aed'/><rect x='319.5' y='271.6' width='243.4' height='24.0' rx='4' fill='#ffffff'/><text x='441.2' y='283.6' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='13' font-weight='700' fill='#7c3aed'>SW2 too early: false start, red</text><path d='M625.2,169.4 Q744.2,204.9 838.4,285.7' fill='none' stroke='#0f766e' stroke-width='3'/><polygon points='838.4,285.7 823.2,281.9 832.3,271.3' fill='#0f766e'/><rect x='652.6' y='196.2' width='250.8' height='24.0' rx='4' fill='#ffffff'/><text x='778.0' y='208.2' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='13' font-weight='700' fill='#0f766e'>Timer1A runs out: green, note ms</text><path d='M822.0,330.0 Q560.0,330.0 298.0,330.0' fill='none' stroke='#7c3aed' stroke-width='3'/><polygon points='298.0,330.0 312.0,323.0 312.0,337.0' fill='#7c3aed'/><rect x='434.6' y='318.0' width='250.8' height='24.0' rx='4' fill='#ffffff'/><text x='560.0' y='330.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='13' font-weight='700' fill='#7c3aed'>SW2: reaction = ms - go_ms, blue</text><line x1='76' y1='330' x2='156' y2='330' stroke='#57606a' stroke-width='3'/><polygon points='162.0,330.0 148.0,337.0 148.0,323.0' fill='#57606a'/><text x='70.0' y='330.0' text-anchor='end' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='13' font-weight='700' fill='#57606a'>start</text><circle cx='230' cy='330' r='64' fill='#3a3f47' stroke='#1f2328' stroke-width='2.5'/><text x='230.0' y='321.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='16' font-weight='800' fill='#ffffff'>Idle</text><text x='230.0' y='344.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='12.5' font-weight='400' fill='#ffffff'>off, red or blue</text><circle cx='560' cy='150' r='64' fill='#3a3f47' stroke='#1f2328' stroke-width='2.5'/><text x='560.0' y='141.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='16' font-weight='800' fill='#ffffff'>Waiting</text><text x='560.0' y='164.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='12.5' font-weight='400' fill='#ffffff'>LED off</text><circle cx='890' cy='330' r='64' fill='#16a34a' stroke='#166534' stroke-width='2.5'/><text x='890.0' y='321.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='16' font-weight='800' fill='#ffffff'>Go</text><text x='890.0' y='344.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='12.5' font-weight='400' fill='#ffffff'>green</text><line x1='40' y1='442' x2='74' y2='442' stroke='#c2410c' stroke-width='3'/><polygon points='82.0,442.0 68.0,449.0 68.0,435.0' fill='#c2410c'/><text x='92.0' y='442.0' text-anchor='start' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='13' font-weight='400' fill='#1f2328'>SW1: start</text><line x1='188.0' y1='442' x2='222.0' y2='442' stroke='#7c3aed' stroke-width='3'/><polygon points='230.0,442.0 216.0,449.0 216.0,435.0' fill='#7c3aed'/><text x='240.0' y='442.0' text-anchor='start' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='13' font-weight='400' fill='#1f2328'>SW2: react</text><line x1='336.0' y1='442' x2='370.0' y2='442' stroke='#0f766e' stroke-width='3'/><polygon points='378.0,442.0 364.0,449.0 364.0,435.0' fill='#0f766e'/><text x='388.0' y='442.0' text-anchor='start' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='13' font-weight='400' fill='#1f2328'>Timer1A time-out</text><text x='539.6' y='442.0' text-anchor='start' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='13' font-weight='400' fill='#57606a'>Each circle is a state, filled with its LED colour.</text></svg>