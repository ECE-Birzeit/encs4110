<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 330' width='1000' height='330' role='img' aria-label='State diagram of the stopwatch. Stopped, LED off: SW1 starts it, noting the time with millis(), and goes to Running; SW2 resets the time to 00:00.0 and stays in Stopped. Running, green: SW1 stops it, adds the run to the total, and goes back to Stopped; SW2 is ignored.'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#333'/></marker></defs><rect width='1000' height='330' fill='#fff'/><path d='M404.5,128.5 Q520.0,90.0 635.5,128.5' fill='none' stroke='#c2410c' stroke-width='3'/><polygon points='635.5,128.5 620.0,130.7 624.4,117.4' fill='#c2410c'/><rect x='420.5' y='93.2' width='199.0' height='24.0' rx='4' fill='#ffffff'/><text x='520.0' y='105.2' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='13' font-weight='700' fill='#c2410c'>SW1: start, note millis()</text><path d='M635.5,171.5 Q520.0,210.0 404.5,171.5' fill='none' stroke='#c2410c' stroke-width='3'/><polygon points='404.5,171.5 420.0,169.3 415.6,182.6' fill='#c2410c'/><rect x='383.5' y='182.8' width='273.0' height='24.0' rx='4' fill='#ffffff'/><text x='520.0' y='194.8' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='13' font-weight='700' fill='#c2410c'>SW1: stop, add the run to the total</text><path d='M281.7,181.0 C210.7,237.2 210.7,62.8 278.2,117.1' fill='none' stroke='#7c3aed' stroke-width='3'/><polygon points='278.2,117.1 262.9,113.8 271.7,102.9' fill='#7c3aed'/><text x='184.0' y='150.0' text-anchor='end' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='13' font-weight='700' fill='#7c3aed'>SW2: reset to 00:00.0</text><circle cx='340' cy='150' r='64' fill='#3a3f47' stroke='#1f2328' stroke-width='2.5'/><text x='340.0' y='141.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='16' font-weight='800' fill='#ffffff'>Stopped</text><text x='340.0' y='164.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='12.5' font-weight='400' fill='#ffffff'>LED off</text><circle cx='700' cy='150' r='64' fill='#16a34a' stroke='#166534' stroke-width='2.5'/><text x='700.0' y='141.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='16' font-weight='800' fill='#ffffff'>Running</text><text x='700.0' y='164.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='12.5' font-weight='400' fill='#ffffff'>green</text><line x1='40' y1='302' x2='74' y2='302' stroke='#c2410c' stroke-width='3'/><polygon points='82.0,302.0 68.0,309.0 68.0,295.0' fill='#c2410c'/><text x='92.0' y='302.0' text-anchor='start' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='13' font-weight='400' fill='#1f2328'>SW1: start and stop</text><line x1='256.4' y1='302' x2='290.4' y2='302' stroke='#7c3aed' stroke-width='3'/><polygon points='298.4,302.0 284.4,309.0 284.4,295.0' fill='#7c3aed'/><text x='308.4' y='302.0' text-anchor='start' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='13' font-weight='400' fill='#1f2328'>SW2: reset</text><text x='414.4' y='302.0' text-anchor='start' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='13' font-weight='400' fill='#57606a'>Each circle is a state, filled with its LED colour.</text></svg>