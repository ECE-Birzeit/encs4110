<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 300' width='900' height='300' role='img' aria-label='GPTM PWM mode: the counter counts down from TAILR to 0; the output goes high when the counter reloads and low when it reaches TAMATCHR'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#333'/></marker></defs><rect width='900' height='300' fill='#fff'/><line x1='110' y1='150' x2='800' y2='150' stroke='#333' marker-end='url(#a)'/><line x1='110' y1='150' x2='110' y2='20' stroke='#333' marker-end='url(#a)'/><text x='110' y='14' text-anchor='middle' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='13' fill='#24292f'>Counter</text><line x1='110' y1='250' x2='800' y2='250' stroke='#333' marker-end='url(#a)'/><text x='806' y='254' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='13' fill='#24292f'>Time</text><text x='100' y='229.0' text-anchor='end' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='13' fill='#24292f'>CCP pin</text><text x='102' y='44' text-anchor='end' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='12' fill='#57606a'>TAILR</text><text x='102' y='82.5' text-anchor='end' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='12' fill='#57606a'>TAMATCHR</text><text x='102' y='154' text-anchor='end' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='12' fill='#57606a'>0</text><line x1='110' y1='78.5' x2='770' y2='78.5' stroke='#dc2626' stroke-width='1.5' stroke-dasharray='6 4'/><line x1='110' y1='40' x2='770' y2='40' stroke='#d0d7de' stroke-dasharray='2 4'/><polyline fill='none' stroke='#2563eb' stroke-width='2.5' points='110,40 330,150 330,40 330,40 550,150 550,40 550,40 770,150'/><polyline fill='none' stroke='#00878F' stroke-width='2.5' points='110,250 110,200 187.0,200 187.0,250 330,250 330,200 407.0,200 407.0,250 550,250 550,200 627.0,200 627.0,250 770,250'/><line x1='187.0' y1='78.5' x2='187.0' y2='200' stroke='#9ca3af' stroke-dasharray='3 3'/><circle cx='187.0' cy='78.5' r='4' fill='#dc2626'/><line x1='407.0' y1='78.5' x2='407.0' y2='200' stroke='#9ca3af' stroke-dasharray='3 3'/><circle cx='407.0' cy='78.5' r='4' fill='#dc2626'/><line x1='627.0' y1='78.5' x2='627.0' y2='200' stroke='#9ca3af' stroke-dasharray='3 3'/><circle cx='627.0' cy='78.5' r='4' fill='#dc2626'/><line x1='332' y1='186' x2='405.0' y2='186' stroke='#333' marker-start='url(#a)' marker-end='url(#a)'/><text x='368.5' y='180' text-anchor='middle' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='12' fill='#24292f'>high: TAILR − TAMATCHR</text><line x1='552' y1='272' x2='768' y2='272' stroke='#333' marker-start='url(#a)' marker-end='url(#a)'/><text x='660.0' y='288' text-anchor='middle' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='12' fill='#24292f'>period: TAILR + 1 counts</text><text x='784' y='82.5' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='12' fill='#dc2626'>match:</text><text x='784' y='97.5' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='12' fill='#dc2626'>pin goes low</text><text x='784' y='44' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='12' fill='#2563eb'>reload:</text><text x='784' y='59' font-family='ui-sans-serif, system-ui, -apple-system, sans-serif' font-size='12' fill='#2563eb'>pin goes high</text></svg>