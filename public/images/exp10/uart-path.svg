<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1120 400' width='1120' height='400' role='img' aria-label='UART0&#x27;s path to the PC: the TM4C123&#x27;s UART0 on PA0 and PA1 connects on the board to the ICDI debug chip, which passes the bytes over the debug USB cable to a virtual COM port on the PC; the terminal opens that port at 115200 baud, 8 data bits, no parity, 1 stop bit'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#333'/></marker></defs><rect width='1120' height='400' fill='#fff'/><rect x='30.0' y='70.0' width='300.0' height='270.0' rx='12' fill='#f6f8fa' stroke='#57606a' stroke-width='1.5'/><text x='180.0' y='98.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='15' font-weight='700' fill='#1f2328'>PC</text><text x='180.0' y='122.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='12.5' font-weight='400' fill='#57606a'>terminal (PuTTY)</text><text x='56.0' y='152.0' text-anchor='start' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='12.5' font-weight='400' fill='#57606a'>Connection</text><text x='304.0' y='152.0' text-anchor='end' dominant-baseline='central' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size='12.5' font-weight='700' fill='#1f2328'>Serial</text><text x='56.0' y='177.0' text-anchor='start' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='12.5' font-weight='400' fill='#57606a'>Port</text><text x='304.0' y='177.0' text-anchor='end' dominant-baseline='central' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size='12.5' font-weight='700' fill='#1f2328'>COM n (Device Manager)</text><text x='56.0' y='202.0' text-anchor='start' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='12.5' font-weight='400' fill='#57606a'>Speed</text><text x='304.0' y='202.0' text-anchor='end' dominant-baseline='central' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size='12.5' font-weight='700' fill='#1f2328'>115200</text><text x='56.0' y='227.0' text-anchor='start' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='12.5' font-weight='400' fill='#57606a'>Data bits</text><text x='304.0' y='227.0' text-anchor='end' dominant-baseline='central' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size='12.5' font-weight='700' fill='#1f2328'>8</text><text x='56.0' y='252.0' text-anchor='start' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='12.5' font-weight='400' fill='#57606a'>Parity</text><text x='304.0' y='252.0' text-anchor='end' dominant-baseline='central' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size='12.5' font-weight='700' fill='#1f2328'>None</text><text x='56.0' y='277.0' text-anchor='start' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='12.5' font-weight='400' fill='#57606a'>Stop bits</text><text x='304.0' y='277.0' text-anchor='end' dominant-baseline='central' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size='12.5' font-weight='700' fill='#1f2328'>1</text><text x='56.0' y='302.0' text-anchor='start' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='12.5' font-weight='400' fill='#57606a'>Flow control</text><text x='304.0' y='302.0' text-anchor='end' dominant-baseline='central' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size='12.5' font-weight='700' fill='#1f2328'>None</text><polyline fill='none' stroke='#57606a' stroke-width='6' stroke-linejoin='round' stroke-linecap='round' points='330.0,205.0 500.0,205.0'/><text x='415.0' y='184.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='12.5' font-weight='700' fill='#1f2328'>USB cable</text><text x='415.0' y='228.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='11.5' font-weight='400' fill='#57606a'>DEBUG port</text><rect x='500.0' y='40.0' width='590.0' height='330.0' rx='14' fill='#f4d6d6' stroke='#c99a9a' stroke-width='1.5'/><text x='795.0' y='64.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='15' font-weight='700' fill='#1f2328'>LaunchPad</text><rect x='530.0' y='130.0' width='210.0' height='150.0' rx='8' fill='#2b2f36'/><text x='635.0' y='172.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='15' font-weight='800' fill='#ffffff'>ICDI</text><text x='635.0' y='196.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='12' font-weight='400' fill='#c3c7cc'>debug probe</text><text x='635.0' y='222.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='12' font-weight='400' fill='#c3c7cc'>USB ↔ serial bridge</text><text x='635.0' y='246.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='11' font-weight='400' fill='#c3c7cc'>&quot;Stellaris Virtual</text><text x='635.0' y='262.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='11' font-weight='400' fill='#c3c7cc'>Serial Port&quot; on the PC</text><rect x='880.0' y='130.0' width='180.0' height='150.0' rx='8' fill='#2b2f36'/><text x='970.0' y='186.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='15' font-weight='800' fill='#ffffff'>TM4C123</text><text x='970.0' y='210.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='13' font-weight='700' fill='#c3c7cc'>UART0</text><polyline fill='none' stroke='#00878F' stroke-width='3' stroke-linejoin='round' stroke-linecap='round' points='880.0,180.0 754.0,180.0' marker-end='url(#a)'/><text x='812.0' y='166.0' text-anchor='middle' dominant-baseline='central' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size='12' font-weight='700' fill='#1f2328'>PA1 = U0Tx</text><polyline fill='none' stroke='#2563eb' stroke-width='3' stroke-linejoin='round' stroke-linecap='round' points='740.0,232.0 868.0,232.0' marker-end='url(#a)'/><text x='812.0' y='252.0' text-anchor='middle' dominant-baseline='central' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size='12' font-weight='700' fill='#1f2328'>PA0 = U0Rx</text><text x='795.0' y='330.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='12.5' font-weight='400' fill='#57606a'>Wired on the board: nothing to connect but the USB cable.</text></svg>