<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 600' width='1000' height='600' role='img' aria-label='State diagram of the vending machine. Idle, LED off: SW1 goes to One coin; SW2 stays in Idle. One coin, blue: SW1 goes to Ready; SW2 refunds and goes back to Idle. Ready, green: SW2 dispenses and goes to Vend; SW1 stays in Ready, the coin is refused. Vend, white: SW1 goes to One coin; SW2 goes to Idle.'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#333'/></marker></defs><rect width='1000' height='600' fill='#fff'/><path d='M296.0,153.5 Q470.0,110.0 644.0,153.5' fill='none' stroke='#c2410c' stroke-width='3'/><polygon points='644.0,153.5 628.8,156.9 632.1,143.3' fill='#c2410c'/><rect x='429.7' y='115.8' width='80.6' height='24.0' rx='4' fill='#ffffff'/><text x='470.0' y='127.8' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='13' font-weight='700' fill='#c2410c'>SW1: coin</text><path d='M644.0,186.5 Q470.0,230.0 296.0,186.5' fill='none' stroke='#7c3aed' stroke-width='3'/><polygon points='296.0,186.5 311.2,183.1 307.9,196.7' fill='#7c3aed'/><rect x='422.3' y='200.2' width='95.4' height='24.0' rx='4' fill='#ffffff'/><text x='470.0' y='212.2' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='13' font-weight='700' fill='#7c3aed'>SW2: refund</text><path d='M710.0,238.0 Q710.0,310.0 710.0,382.0' fill='none' stroke='#c2410c' stroke-width='3'/><polygon points='710.0,382.0 703.0,368.0 717.0,368.0' fill='#c2410c'/><rect x='724.0' y='298.0' width='80.6' height='24.0' rx='4' fill='#ffffff'/><text x='724.0' y='310.0' text-anchor='start' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='13' font-weight='700' fill='#c2410c'>SW1: coin</text><path d='M642.0,450.0 Q470.0,450.0 298.0,450.0' fill='none' stroke='#7c3aed' stroke-width='3'/><polygon points='298.0,450.0 312.0,443.0 312.0,457.0' fill='#7c3aed'/><rect x='414.9' y='438.0' width='110.2' height='24.0' rx='4' fill='#ffffff'/><text x='470.0' y='450.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='13' font-weight='700' fill='#7c3aed'>SW2: dispense</text><path d='M230.0,382.0 Q230.0,310.0 230.0,238.0' fill='none' stroke='#7c3aed' stroke-width='3'/><polygon points='230.0,238.0 237.0,252.0 223.0,252.0' fill='#7c3aed'/><rect x='83.6' y='298.0' width='132.4' height='24.0' rx='4' fill='#ffffff'/><text x='216.0' y='310.0' text-anchor='end' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='13' font-weight='700' fill='#7c3aed'>SW2: drink taken</text><path d='M288.7,415.7 Q470.0,310.0 651.3,204.3' fill='none' stroke='#c2410c' stroke-width='3'/><polygon points='651.3,204.3 642.7,217.4 635.6,205.3' fill='#c2410c'/><rect x='370.5' y='298.0' width='199.0' height='24.0' rx='4' fill='#ffffff'/><text x='470.0' y='310.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='13' font-weight='700' fill='#c2410c'>SW1: next customer&#x27;s coin</text><path d='M199.0,111.7 C142.8,40.7 317.2,40.7 262.9,108.2' fill='none' stroke='#7c3aed' stroke-width='3'/><polygon points='262.9,108.2 266.2,92.9 277.1,101.7' fill='#7c3aed'/><rect x='141.6' y='10.0' width='176.8' height='24.0' rx='4' fill='#ffffff'/><text x='230.0' y='22.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='13' font-weight='700' fill='#7c3aed'>SW2: nothing to refund</text><path d='M768.3,419.0 C839.3,362.8 839.3,537.2 771.8,482.9' fill='none' stroke='#c2410c' stroke-width