<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 400' width='820' height='400' role='img' aria-label='The potentiometer on the LaunchPad: one outer pin to 3.3 V on J1 pin 1, the middle pin (wiper) to PE3, which is AIN0, on J3 pin 9, and the other outer pin to GND on J3 pin 2'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#333'/></marker></defs><rect width='820' height='400' fill='#fff'/><rect x='520.0' y='100.0' width='260.0' height='220.0' rx='12' fill='#f4d6d6' stroke='#c99a9a' stroke-width='1.5'/><text x='650.0' y='126.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='15' font-weight='700' fill='#1f2328'>LaunchPad</text><rect x='514.0' y='144.0' width='12.0' height='12.0' rx='2' fill='#d9a400'/><text x='542.0' y='142.0' text-anchor='start' dominant-baseline='central' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size='13' font-weight='700' fill='#1f2328'>3.3V</text><text x='542.0' y='160.0' text-anchor='start' dominant-baseline='central' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size='11.5' font-weight='400' fill='#57606a'>J1.1</text><rect x='514.0' y='204.0' width='12.0' height='12.0' rx='2' fill='#d9a400'/><text x='542.0' y='202.0' text-anchor='start' dominant-baseline='central' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size='13' font-weight='700' fill='#1f2328'>PE3 (AIN0)</text><text x='542.0' y='220.0' text-anchor='start' dominant-baseline='central' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size='11.5' font-weight='400' fill='#57606a'>J3.9</text><rect x='514.0' y='264.0' width='12.0' height='12.0' rx='2' fill='#d9a400'/><text x='542.0' y='262.0' text-anchor='start' dominant-baseline='central' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size='13' font-weight='700' fill='#1f2328'>GND</text><text x='542.0' y='280.0' text-anchor='start' dominant-baseline='central' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size='11.5' font-weight='400' fill='#57606a'>J3.2</text><rect x='140.0' y='150.0' width='80.0' height='120.0' rx='8' fill='#2b5fb8'/><circle cx='180' cy='210' r='22' fill='#e8eef8'/><line x1='166' y1='210' x2='194' y2='210' stroke='#2b5fb8' stroke-width='4' stroke-linecap='round'/><text x='180.0' y='294.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='13' font-weight='700' fill='#1f2328'>10 kΩ potentiometer</text><rect x='220.0' y='171.0' width='14.0' height='6.0' rx='1' fill='#9aa4ae'/><polyline fill='none' stroke='#f08c00' stroke-width='3' stroke-linejoin='round' stroke-linecap='round' points='234.0,174.0 420.0,174.0 420.0,150.0 514.0,150.0'/><text x='242.0' y='162.0' text-anchor='start' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='11' font-weight='400' fill='#57606a'>outer pin</text><rect x='220.0' y='207.0' width='14.0' height='6.0' rx='1' fill='#9aa4ae'/><polyline fill='none' stroke='#2563eb' stroke-width='3' stroke-linejoin='round' stroke-linecap='round' points='234.0,210.0 420.0,210.0 420.0,210.0 514.0,210.0'/><text x='242.0' y='198.0' text-anchor='start' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='11' font-weight='400' fill='#57606a'>wiper</text><rect x='220.0' y='243.0' width='14.0' height='6.0' rx='1' fill='#9aa4ae'/><polyline fill='none' stroke='#1f2328' stroke-width='3' stroke-linejoin='round' stroke-linecap='round' points='234.0,246.0 420.0,246.0 420.0,270.0 514.0,270.0'/><text x='242.0' y='234.0' text-anchor='start' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='11' font-weight='400' fill='#57606a'>outer pin</text><text x='410.0' y='375.0' text-anchor='middle' dominant-baseline='central' font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size='12.5' font-weight='400' fill='#57606a'>Use 3.3V, not VBUS: PE3 must never see more than 3.3 V.</text></svg>